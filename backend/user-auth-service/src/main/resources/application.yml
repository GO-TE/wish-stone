server:
  port: 8081

spring:
  application:
    name: user-auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:user_db;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=GROUPS,USER,VALUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

stonewish:
  jwt:
    secret: ${STONEWISH_JWT_SECRET:stonewish-default-hmac-sha256-secret-key-2026-secure}
    ttl-seconds: ${STONEWISH_JWT_TTL_SECONDS:604800}
