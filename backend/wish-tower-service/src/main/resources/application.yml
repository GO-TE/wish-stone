server:
  port: 8082

spring:
  application:
    name: wish-tower-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:wish_db;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=GROUPS,USER,VALUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:false}

services:
  user-auth:
    url: ${USER_AUTH_SERVICE_URL:http://localhost:8081}
  group:
    url: ${GROUP_SERVICE_URL:http://localhost:8084}

stonewish:
  quota:
    daily-base: 5
