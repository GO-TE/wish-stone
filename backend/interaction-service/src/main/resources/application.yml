server:
  port: 8083

spring:
  application:
    name: interaction-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:interaction_db;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=GROUPS,USER,VALUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:false}

stonewish:
  cheer:
    threshold:
      level1: 1
      level2: 5
      level3: 15
  report:
    auto-hide-threshold: 5
